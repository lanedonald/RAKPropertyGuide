<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donald Lane — Digital Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Markazi+Text:wght@500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --navy: #0B2027;
    --navy-2: #102C34;
    --sand: #F5F1E8;
    --sand-dim: #C9C3B4;
    --gold: #C6A15B;
    --gold-bright: #DCB975;
    --line: rgba(245,241,232,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 50% 0%, var(--navy-2) 0%, var(--navy) 65%);
    font-family:'Public Sans', sans-serif;
    color:var(--sand);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .lang-toggle{
    display:inline-flex;
    border:1px solid var(--line);
    border-radius:2px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .lang-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    padding:8px 14px;
    background:transparent;
    color:var(--sand-dim);
    border:none;
    cursor:pointer;
    transition: all .15s ease;
  }
  .lang-btn + .lang-btn{ border-left:1px solid var(--line); }
  body.lang-ar .lang-btn + .lang-btn{ border-left:none; border-right:1px solid var(--line); }
  .lang-btn.active{ background:var(--gold); color:var(--navy); font-weight:600; }
  .lang-btn:hover:not(.active){ color:var(--gold-bright); }

  .card{
    width:100%;
    max-width:380px;
    background:var(--navy);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .card-top{
    padding:36px 28px 26px;
    text-align:center;
    position:relative;
    border-bottom:1px solid var(--line);
  }
  .avatar{
    width:96px; height:96px;
    border-radius:50%;
    border:1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 18px;
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .card-top .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold-bright);
    display:block;
    margin-bottom:8px;
  }
  .card-top h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 6px;
  }
  .card-top .role{ font-size:13.5px; color:var(--sand-dim); }

  .card-body{padding:24px 24px 8px;}

  .actions{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px;}
  .act{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:14px 6px;
    background:var(--navy-2);
    border:1px solid var(--line);
    text-decoration:none;
    color:var(--sand);
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    transition: background .15s ease, border-color .15s ease;
  }
  .act:hover{ border-color:var(--gold); color:var(--gold-bright); }
  .act svg{width:20px; height:20px; stroke:var(--gold-bright);}

  .info-list{list-style:none; margin:0 0 22px; padding:0;}
  .info-list li{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0;
    border-top:1px solid var(--line);
    font-size:14px;
  }
  .info-list li:last-child{border-bottom:1px solid var(--line);}
  .info-list .k{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--sand-dim);
  }
  .info-list a{color:var(--sand); text-decoration:none;}
  .info-list a:hover{color:var(--gold-bright);}

  .save-btn{
    display:block;
    width:100%;
    text-align:center;
    padding:14px;
    background:var(--gold);
    color:var(--navy);
    border:none;
    font-weight:600;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    cursor:pointer;
    margin-bottom:24px;
    transition: background .15s ease;
  }
  .save-btn:hover{background:var(--gold-bright);}

  .qr-block{
    border-top:1px solid var(--line);
    padding:22px 0 26px;
    text-align:center;
  }
  .qr-block .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--sand-dim);
    display:block;
    margin-bottom:14px;
  }
  #qrcode{display:flex; justify-content:center; margin-bottom:10px;}
  #qrcode img, #qrcode canvas{border:6px solid var(--sand); box-shadow:0 4px 14px rgba(0,0,0,0.3);}
  .qr-caption{font-size:12.5px; color:var(--sand-dim);}

  .card-foot{
    background:var(--navy-2);
    padding:16px 24px;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    color:var(--sand-dim);
  }
  .card-foot a{color:var(--gold-bright); text-decoration:underline; text-underline-offset:2px;}

  body.lang-ar{ direction:rtl; }
  body.lang-ar, body.lang-ar h1{ font-family:'Markazi Text', 'Cairo', serif; }
  body.lang-ar .card-top .role,
  body.lang-ar .card-body{ font-family:'Cairo', sans-serif; }
  body.lang-ar .card-top .eyebrow,
  body.lang-ar .act,
  body.lang-ar .info-list .k,
  body.lang-ar .save-btn,
  body.lang-ar .qr-block .eyebrow,
  body.lang-ar .card-foot,
  body.lang-ar .lang-btn{
    font-family:'Cairo', sans-serif;
    letter-spacing:0;
    text-transform:none;
  }

  @media (prefers-reduced-motion: reduce){
    .act{transition:none;}
    .save-btn{transition:none;}
  }
  :focus-visible{ outline:2px solid var(--gold-bright); outline-offset:3px; }
</style>
</head>
<body>
<script>
  if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
  window.scrollTo(0, 0);
</script>


<div class="lang-toggle" role="group" aria-label="Language toggle">
  <button type="button" class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
  <button type="button" class="lang-btn" id="btn-ar" onclick="setLang('ar')">عربي</button>
</div>

<div class="card">
  <div class="card-top">
    <span class="eyebrow" data-i18n="agency">K&amp;Core Real Estate</span>
    <div class="avatar"><img src="donald-lane.jpg" alt="Donald Lane"></div>
    <h1 data-i18n="name">Donald Lane</h1>
    <div class="role" data-i18n="role">Real Estate Agent · Ras Al Khaimah, UAE</div>
  </div>

  <div class="card-body">
    <div class="actions">
      <a class="act" href="tel:+971504843192">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h1.5a2.25 2.25 0 002.25-2.25v-1.372a1.5 1.5 0 00-1.106-1.447l-4.11-1.174a1.5 1.5 0 00-1.567.42l-.97 1.02a12.045 12.045 0 01-6.113-6.113l1.02-.97a1.5 1.5 0 00.42-1.567L7.44 3.356a1.5 1.5 0 00-1.447-1.106H4.5A2.25 2.25 0 002.25 4.5v2.25z"/></svg>
        <span data-i18n="actCall">Call</span>
      </a>
      <a class="act" href="https://wa.me/971504843192" target="_blank" rel="noopener">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 10.5h.008v.008H8.25V10.5zm3.75 0h.008v.008H12V10.5zm3.75 0h.008v.008h-.008V10.5zM21 12a9 9 0 11-18 0 9 9 0 0118 0zM6 20l1.2-3.6A8.96 8.96 0 016 12"/></svg>
        <span data-i18n="actWhatsapp">WhatsApp</span>
      </a>
      <a class="act" href="mailto:lane.donald@gmail.com">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25H4.5a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
        <span data-i18n="actEmail">Email</span>
      </a>
    </div>

    <ul class="info-list">
      <li><span class="k" data-i18n="labelPhone">Phone</span><a href="tel:+971504843192">050 484 3192</a></li>
      <li><span class="k" data-i18n="labelEmail">Email</span><a href="mailto:lane.donald@gmail.com">lane.donald@gmail.com</a></li>
      <li><span class="k" data-i18n="labelBrokerage">Brokerage</span><a href="https://kandcorealestate.ae/agent/donald-john-lane/" target="_blank" rel="noopener" data-i18n="brokerageLink">K&amp;Core Real Estate ↗</a></li>
      <li><span class="k" data-i18n="labelInstagram">Instagram</span><a href="https://instagram.com/RAKPropertyPro" target="_blank" rel="noopener">@RAKPropertyPro</a></li>
    </ul>

    <button class="save-btn" onclick="saveContact()" data-i18n="saveBtn">Save Contact</button>

    <div class="qr-block">
      <span class="eyebrow" data-i18n="qrLabel">Scan to WhatsApp</span>
      <div id="qrcode"></div>
      <div class="qr-caption">wa.me/971504843192</div>
    </div>
  </div>

  <div class="card-foot">
    <a href="index.html" data-i18n="backLink">← Back to full profile</a>
  </div>
</div>

<script>
  new QRCode(document.getElementById("qrcode"), {
    text: "https://wa.me/971504843192",
    width: 168,
    height: 168,
    colorDark: "#0B2027",
    colorLight: "#F5F1E8",
    correctLevel: QRCode.CorrectLevel.M
  });

  function saveContact(){
    const vcard = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:Lane;Donald;;;",
      "FN:Donald Lane",
      "ORG:K&Core Real Estate",
      "TITLE:Real Estate Agent",
      "TEL;TYPE=CELL:+971504843192",
      "EMAIL:lane.donald@gmail.com",
      "URL:https://kandcorealestate.ae/agent/donald-john-lane/",
      "ADR;TYPE=WORK:;;Ras Al Khaimah;;;United Arab Emirates",
      "END:VCARD"
    ].join("\n");
    const blob = new Blob([vcard], { type: "text/vcard" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Donald-John-Lane.vcf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const translations = {
    agency: { en: "K&amp;Core Real Estate", ar: "كي آند كور العقارية" },
    name: { en: "Donald Lane", ar: "دونالد لين" },
    role: { en: "Real Estate Agent · Ras Al Khaimah, UAE", ar: "وسيط عقاري · رأس الخيمة، الإمارات" },
    actCall: { en: "Call", ar: "اتصال" },
    actWhatsapp: { en: "WhatsApp", ar: "واتساب" },
    actEmail: { en: "Email", ar: "البريد" },
    labelPhone: { en: "Phone", ar: "الهاتف" },
    labelEmail: { en: "Email", ar: "البريد الإلكتروني" },
    labelBrokerage: { en: "Brokerage", ar: "الوكالة العقارية" },
    brokerageLink: { en: "K&amp;Core Real Estate ↗", ar: "كي آند كور العقارية ↗" },
    labelInstagram: { en: "Instagram", ar: "إنستغرام" },
    saveBtn: { en: "Save Contact", ar: "حفظ جهة الاتصال" },
    qrLabel: { en: "Scan to WhatsApp", ar: "امسح للتواصل عبر واتساب" },
    backLink: { en: "← Back to full profile", ar: "→ العودة إلى الملف الكامل" }
  };

  function applyTranslations(lang){
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      const key = el.getAttribute('data-i18n');
      if(translations[key]) el.innerHTML = translations[key][lang];
    });
  }

  function setLang(lang){
    const isAr = lang === 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = isAr ? 'rtl' : 'ltr';
    document.body.classList.toggle('lang-ar', isAr);
    document.getElementById('btn-en').classList.toggle('active', !isAr);
    document.getElementById('btn-ar').classList.toggle('active', isAr);
    applyTranslations(lang);
    document.title = isAr ? 'دونالد لين — البطاقة الرقمية' : 'Donald Lane — Digital Card';
    try{ localStorage.setItem('site-lang', lang); }catch(e){}
  }

  (function(){
    let saved = 'en';
    try{ saved = localStorage.getItem('site-lang') || 'en'; }catch(e){}
    if(saved === 'ar') setLang('ar');
  })();
</script>

</body>
</html>
